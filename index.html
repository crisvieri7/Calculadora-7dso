<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7DS: Origin - Estimador de CP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f0f11;
      background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                        url('IMG_2226.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: rgba(26, 26, 30, 0.92);
      border: 1px solid #2d2d35;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
    }

    .title {
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 16px;
    }

    .input-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #a0a0ab;
      margin-bottom: 4px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 8px 10px;
      background-color: #0d0d0f;
      border: 1px solid #33333d;
      border-radius: 6px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #ff7b3d;
    }

    .stats-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .stat-row {
      background-color: rgba(13, 13, 15, 0.6);
      border: 1px solid #282830;
      border-radius: 8px;
      padding: 10px;
    }

    .stat-row-title {
      font-size: 0.78rem;
      color: #ff7b3d;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-calc {
      width: 100%;
      background-color: #e65100;
      color: white;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .result-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }

    .result-title {
      font-weight: bold;
      font-size: 0.88rem;
      margin-bottom: 4px;
    }

    .result-value {
      font-size: 1.15rem;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      font-size: 0.78rem;
      color: #70707a;
      margin-top: 16px;
    }

    .footer span {
      color: #ff7b3d;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="title">🔥 7DS: Origin - Estimador de Orbe</div>

  <div class="input-group">
    <label for="cpActual">Poder de Equipo Actual (CP)</label>
    <input type="number" inputmode="decimal" id="cpActual" value="138503">
  </div>

  <div class="stats-container">
    
    <!-- Ranura 1 -->
    <div class="stat-row">
      <div class="stat-row-title">SLOT 1</div>
      <div class="input-group">
        <select id="statType1">
          <option value="atkFuego">Aumento del ataque de tipo fuego %</option>
          <option value="dmgFuego" selected>Aumento del daño de tipo fuego %</option>
          <option value="dmgEsp">Aumento del daño de los ataques especiales %</option>
          <option value="dmgNorm">Aumento del daño de los ataques normales %</option>
          <option value="probCrit">Probabilidad de crítico %</option>
          <option value="dmgCrit">Daño crítico %</option>
          <option value="cargaMagica">Eficacia de la carga mágica %</option>
          <option value="rafagasFuego">Eficacia de las Ráfagas de fuego %</option>
          <option value="dmgHabNorm">Aumento del daño de las habilidades normales %</option>
          <option value="dmgHabRelevo">Aumento del daño de las habilidades de relevo %</option>
          <option value="dmgDefinitivos">Aumento del daño de los movimientos definitivos %</option>
          <option value="cdr">Reducción del tiempo de recuperación %</option>
          <option value="defensa">Aumento de la defensa %</option>
          <option value="ps">Aumento de los PS %</option>
          <option value="resCrit">Resistencia crítica %</option>
          <option value="defCrit">Defensa crítica %</option>
        </select>
      </div>
      <div class="grid-2col">
        <div>
          <label>Actual %</label>
          <input type="number" inputmode="decimal" step="0.01" id="act1" value="13.53">
        </div>
        <div>
          <label>Nuevo %</label>
          <input type="number" inputmode="decimal" step="0.01" id="nue1" value="0">
        </div>
      </div>
    </div>

    <!-- Ranura 2 -->
    <div class="stat-row">
      <div class="stat-row-title">SLOT 2</div>
      <div class="input-group">
        <select id="statType2">
          <option value="atkFuego" selected>Aumento del ataque de tipo fuego %</option>
          <option value="dmgFuego">Aumento del daño de tipo fuego %</option>
          <option value="dmgEsp">Aumento del daño de los ataques especiales %</option>
          <option value="dmgNorm">Aumento del daño de los ataques normales %</option>
          <option value="probCrit">Probabilidad de crítico %</option>
          <option value="dmgCrit">Daño crítico %</option>
          <option value="cargaMagica">Eficacia de la carga mágica %</option>
          <option value="rafagasFuego">Eficacia de las Ráfagas de fuego %</option>
          <option value="dmgHabNorm">Aumento del daño de las habilidades normales %</option>
          <option value="dmgHabRelevo">Aumento del daño de las habilidades de relevo %</option>
          <option value="dmgDefinitivos">Aumento del daño de los movimientos definitivos %</option>
          <option value="cdr">Reducción del tiempo de recuperación %</option>
          <option value="defensa">Aumento de la defensa %</option>
          <option value="ps">Aumento de los PS %</option>
        </select>
      </div>
      <div class="grid-2col">
        <div>
          <label>Actual %</label>
          <input type="number" inputmode="decimal" step="0.01" id="act2" value="33.76">
        </div>
        <div>
          <label>Nuevo %</label>
          <input type="number" inputmode="decimal" step="0.01" id="nue2" value="47.29">
        </div>
      </div>
    </div>

    <!-- Ranura 3 -->
    <div class="stat-row">
      <div class="stat-row-title">SLOT 3</div>
      <div class="input-group">
        <select id="statType3">
          <option value="cargaMagica" selected>Eficacia de la carga mágica %</option>
          <option value="atkFuego">Aumento del ataque de tipo fuego %</option>
          <option value="dmgFuego">Aumento del daño de tipo fuego %</option>
          <option value="dmgEsp">Aumento del daño de los ataques especiales %</option>
          <option value="dmgNorm">Aumento del daño de los ataques normales %</option>
          <option value="probCrit">Probabilidad de crítico %</option>
          <option value="dmgCrit">Daño crítico %</option>
          <option value="rafagasFuego">Eficacia de las Ráfagas de fuego %</option>
          <option value="dmgHabNorm">Aumento del daño de las habilidades normales %</option>
          <option value="dmgHabRelevo">Aumento del daño de las habilidades de relevo %</option>
          <option value="dmgDefinitivos">Aumento del daño de los movimientos definitivos %</option>
          <option value="cdr">Reducción del tiempo de recuperación %</option>
        </select>
      </div>
      <div class="grid-2col">
        <div>
          <label>Actual %</label>
          <input type="number" inputmode="decimal" step="0.01" id="act3" value="8.95">
        </div>
        <div>
          <label>Nuevo %</label>
          <input type="number" inputmode="decimal" step="0.01" id="nue3" value="0">
        </div>
      </div>
    </div>

    <!-- Ranura 4 -->
    <div class="stat-row">
      <div class="stat-row-title">SLOT 4</div>
      <div class="input-group">
        <select id="statType4">
          <option value="dmgEsp" selected>Aumento del daño de los ataques especiales %</option>
          <option value="dmgCrit">Daño crítico %</option>
          <option value="atkFuego">Aumento del ataque de tipo fuego %</option>
          <option value="dmgFuego">Aumento del daño de tipo fuego %</option>
          <option value="dmgNorm">Aumento del daño de los ataques normales %</option>
          <option value="probCrit">Probabilidad de crítico %</option>
          <option value="cargaMagica">Eficacia de la carga mágica %</option>
          <option value="rafagasFuego">Eficacia de las Ráfagas de fuego %</option>
          <option value="dmgHabNorm">Aumento del daño de las habilidades normales %</option>
          <option value="dmgHabRelevo">Aumento del daño de las habilidades de relevo %</option>
          <option value="dmgDefinitivos">Aumento del daño de los movimientos definitivos %</option>
        </select>
      </div>
      <div class="grid-2col">
        <div>
          <label>Actual %</label>
          <input type="number" inputmode="decimal" step="0.01" id="act4" value="23.34">
        </div>
        <div>
          <label>Nuevo %</label>
          <input type="number" inputmode="decimal" step="0.01" id="nue4" value="25.82">
        </div>
      </div>
    </div>

  </div>

  <button type="button" class="btn-calc" onclick="calcularCP()">CALCULAR NUEVO PODER</button>

  <div id="resultado" class="result-box">
    <div id="tituloResultado" class="result-title"></div>
    <div id="textoResultado" class="result-value"></div>
  </div>

  <div class="footer">Hecho por <span>Crisvieri</span></div>
</div>

<script>
  // Ponderaciones estimadas por stat según escala de CP
  const pesosStats = {
    atkFuego: 0.0035,
    dmgFuego: 0.0032,
    probCrit: 0.0028,
    dmgCrit: 0.0025,
    dmgEsp: 0.0022,
    dmgNorm: 0.0020,
    dmgHabNorm: 0.0020,
    dmgHabRelevo: 0.0018,
    dmgDefinitivos: 0.0024,
    cargaMagica: 0.0015,
    rafagasFuego: 0.0018,
    cdr: 0.0015,
    ps: 0.0012,
    defensa: 0.0010,
    resCrit: 0.0008,
    defCrit: 0.0008
  };

  function calcularCP() {
    const cpActual = parseFloat(document.getElementById('cpActual').value) || 0;
    let cambioTotalPorcentual = 0;

    for (let i = 1; i <= 4; i++) {
      const type = document.getElementById(`statType${i}`).value;
      const actVal = parseFloat(document.getElementById(`act${i}`).value) || 0;
      const nueVal = parseFloat(document.getElementById(`nue${i}`).value) || 0;
      
      const diff = nueVal - actVal;
      const peso = pesosStats[type] || 0.0015;
      
      cambioTotalPorcentual += (diff * peso);
    }

    const incremento = Math.round(cpActual * cambioTotalPorcentual);
    const nuevoCP = cpActual + incremento;

    const resBox = document.getElementById('resultado');
    const resTitle = document.getElementById('tituloResultado');
    const resText = document.getElementById('textoResultado');
    
    resBox.style.display = 'block';
    
    if (incremento >= 0) {
      resBox.style.backgroundColor = '#1b3823';
      resBox.style.border = '1px solid #2e6d3e';
      resTitle.style.color = '#4caf50';
      resTitle.innerText = '✓ ¡TIRADA POSITIVA!';
      resText.style.color = '#81c784';
      resText.innerHTML = `Nuevo CP Estimado: ${nuevoCP.toLocaleString()}<br>(+${incremento.toLocaleString()})`;
    } else {
      resBox.style.backgroundColor = '#381b1b';
      resBox.style.border = '1px solid #6d2e2e';
      resTitle.style.color = '#e57373';
      resTitle.innerText = '✕ ¡TIRADA NEGATIVA!';
      resText.style.color = '#ef9a9a';
      resText.innerHTML = `Nuevo CP Estimado: ${nuevoCP.toLocaleString()}<br>(${incremento.toLocaleString()})`;
    }
  }
</script>

</body>
</html>
