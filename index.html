<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Orbe de Fuego - SøulEaters</title>
  <style>
    :root {
      --bg-dark: #0d0f17;
      --card-bg: rgba(22, 27, 46, 0.95);
      --fire-glow: #ff5400;
      --text-main: #f1f5f9;
      --accent-green: #00f5d4;
      --border-color: #2a324b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding-bottom: 40px;
    }

    /* Pantalla de Entrada con la nueva imagen IMG_2226.jpeg */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(13,15,23,0.85)), 
                  url('IMG_2226.jpeg') center/cover no-repeat;
      background-color: #0d0f17;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 60px;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .enter-box {
      text-align: center;
      padding: 20px;
    }

    .enter-btn {
      padding: 16px 50px;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #fff;
      background: linear-gradient(135deg, #ff5400, #b01802);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 84, 0, 0.8), 0 0 40px rgba(176, 24, 2, 0.6);
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .enter-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(255, 84, 0, 1), 0 0 55px rgba(176, 24, 2, 0.9);
    }

    .fade-out {
      opacity: 0;
      visibility: hidden;
    }

    /* Encabezado */
    header {
      text-align: center;
      margin: 30px 0 20px 0;
      width: 100%;
    }

    .clan-title {
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 12px var(--fire-glow), 0 0 22px #b01802;
    }

    .credits {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Contenedor Principal */
    .main-wrapper {
      width: 100%;
      max-width: 600px;
      padding: 0 15px;
    }

    /* Tarjeta Calculadora */
    .calc-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .calc-top-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .calc-title {
      font-size: 1.2rem;
      color: var(--fire-glow);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .slots-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slot-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .slot-header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 600;
      margin-bottom: 2px;
    }

    select, input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #0f172a;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    select:focus, input:focus { border-color: var(--fire-glow); }

    /* Resultados */
    .results-panel {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .bar-bg {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      margin: 10px 0;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff4d4d, #ffdb4d, var(--accent-green));
      transition: width 0.3s ease;
    }

    .stat-result-box {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 10px;
    }

    .res-block span { display: block; font-size: 0.75rem; color: #94a3b8; }
    .res-block strong { font-size: 1.2rem; color: var(--accent-green); }
  </style>
</head>
<body>

  <!-- Pantalla de Entrada -->
  <div id="intro-screen">
    <div class="enter-box">
      <button class="enter-btn" onclick="enterSite()">ENTRAR</button>
    </div>
  </div>

  <!-- Encabezado -->
  <header>
    <h1 class="clan-title">Clan SøulEaters</h1>
    <p class="credits">Creado por <strong>Christenzen</strong></p>
  </header>

  <!-- Calculadora de Orbe de Fuego -->
  <div class="main-wrapper">
    <div class="calc-card">
      <div class="calc-top-bar">
        <h2 class="calc-title">Orbe de Hechizo: Fuego (4 Ranuras)</h2>
      </div>

      <div id="slots-container" class="slots-grid"></div>

      <!-- Panel Resultados -->
      <div class="results-panel">
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
          <span>Calidad de Encantamiento</span>
          <strong id="quality-text" style="color: var(--accent-green);">0%</strong>
        </div>
        <div class="bar-bg">
          <div id="quality-bar" class="bar-fill"></div>
        </div>

        <div class="stat-result-box">
          <div class="res-block">
            <span>EFICIENCIA</span>
            <strong id="res-rank">-</strong>
          </div>
          <div class="res-block">
            <span>ATAQUE EST.</span>
            <strong id="cp-text">+0</strong>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function enterSite() {
      const intro = document.getElementById('intro-screen');
      intro.classList.add('fade-out');
      setTimeout(() => { intro.style.display = 'none'; }, 600);
    }

    const legendaryStats = {
      "Aumento del ataque de tipo fuego %": { min: 26.26, max: 43.76 },
      "Aumento del daño de tipo fuego %": { min: 11.35, max: 18.98 },
      "Eficacia de la carga mágica %": { min: 5.00, max: 10.00 },
      "Aumento del daño de los ataques especiales %": { min: 15.00, max: 25.00 }
    };

    function buildSlots() {
      const container = document.getElementById('slots-container');
      container.innerHTML = '';

      for (let i = 1; i <= 4; i++) {
        const row = document.createElement('div');
        row.className = 'slot-row';
        
        let options = '';
        for (let stat in legendaryStats) {
          options += `<option value="${stat}">${stat}</option>`;
        }

        row.innerHTML = `
          <div class="slot-header">
            <span>RANURA ${i}</span>
            <span id="range-label-${i}">[0 ~ 0]</span>
          </div>
          <select id="stat-select-${i}" onchange="calculate()">${options}</select>
          <input type="number" id="stat-val-${i}" value="0" step="0.01" 
                 onfocus="if(this.value==='0')this.value=''" 
                 onblur="if(this.value==='')this.value='0'" 
                 oninput="calculate()">
        `;
        container.appendChild(row);
      }
      calculate();
    }

    function calculate() {
      let totalPerc = 0;
      let totalAtkVal = 0;

      for (let i = 1; i <= 4; i++) {
        const select = document.getElementById(`stat-select-${i}`);
        const input = document.getElementById(`stat-val-${i}`);
        const label = document.getElementById(`range-label-${i}`);

        if (!select || !input) continue;

        const statName = select.value;
        const val = parseFloat(input.value) || 0;
        const config = legendaryStats[statName];

        label.innerText = `[${config.min}% ~ ${config.max}%]`;

        let rollQuality = (val - config.min) / (config.max - config.min);
        if (rollQuality < 0) rollQuality = 0;
        if (rollQuality > 1) rollQuality = 1;

        totalPerc += rollQuality;

        if (statName.includes("ataque") || statName.includes("daño")) totalAtkVal += val;
      }

      const finalQuality = Math.round((totalPerc / 4) * 100);
      document.getElementById('quality-bar').style.width = `${finalQuality}%`;
      document.getElementById('quality-text').innerText = `${finalQuality}%`;

      let rank = 'S';
      if (finalQuality < 50) rank = 'C';
      else if (finalQuality < 75) rank = 'B';
      else if (finalQuality < 90) rank = 'A';
      document.getElementById('res-rank').innerText = rank;

      const estimatedCP = Math.round(totalAtkVal * 15 + (finalQuality * 10));
      document.getElementById('cp-text').innerText = `+${estimatedCP}`;
    }

    buildSlots();
  </script>
</body>
</html>
