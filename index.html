<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora 7DS: Origin - CP Estimado</title>
    <style>
        :root { 
            --bg: #090a0f; 
            --card: rgba(22, 27, 34, 0.85); 
            --border: #30363d; 
            --text: #c9d1d9; 
            --accent: #238636; 
            --danger: #da3633; 
            --fire: #ff5500;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 100%, rgba(255, 85, 0, 0.25) 0%, rgba(255, 140, 0, 0.1) 40%, rgba(9, 10, 15, 0) 70%),
                radial-gradient(circle at 20% 20%, rgba(255, 60, 0, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 30%, rgba(255, 120, 0, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
        }
        .app { 
            width: 100%;
            max-width: 500px; 
            background: var(--card); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 8px 32px rgba(255, 85, 0, 0.15), 0 0 15px rgba(0,0,0,0.8); 
            backdrop-filter: blur(8px);
            box-sizing: border-box;
        }
        h1 { 
            font-size: 1.2rem; 
            text-align: center; 
            color: #fff; 
            margin-top: 0; 
            text-shadow: 0 0 10px rgba(255, 85, 0, 0.5);
            letter-spacing: 0.5px;
        }
        .section-title { 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            color: #ff9966; 
            margin: 15px 0 8px 0; 
            border-bottom: 1px solid rgba(255, 85, 0, 0.3); 
            padding-bottom: 4px; 
            font-weight: bold;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { display: block; font-size: 0.75rem; color: #8b949e; margin-top: 6px; }
        input { 
            width: 100%; 
            box-sizing: border-box; 
            background: #010409; 
            border: 1px solid var(--border); 
            color: #fff; 
            padding: 8px; 
            border-radius: 6px; 
            font-size: 0.9rem; 
            transition: all 0.2s;
        }
        input:focus { border-color: #ff5500; outline: none; box-shadow: 0 0 8px rgba(255, 85, 0, 0.4); }
        button { 
            width: 100%; 
            margin-top: 20px; 
            padding: 12px; 
            background: linear-gradient(135deg, #ff5500 0%, #cc2b00 100%); 
            border: none; 
            color: white; 
            font-weight: bold; 
            border-radius: 6px; 
            font-size: 1rem; 
            cursor: pointer; 
            box-shadow: 0 4px 12px rgba(255, 85, 0, 0.3);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        button:active { transform: scale(0.98); }
        #veredicto { margin-top: 15px; padding: 15px; border-radius: 6px; text-align: center; font-weight: bold; display: none; }
        .status-ok { background: rgba(35, 134, 54, 0.25); border: 1px solid var(--accent); color: #3fb950; }
        .status-bad { background: rgba(218, 54, 51, 0.25); border: 1px solid var(--danger); color: #f85149; }
        .cp-val { font-size: 1.3rem; margin-top: 8px; display: block; }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #8b949e;
            letter-spacing: 1px;
        }
        .footer span {
            color: #ff7733;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 85, 0, 0.4);
        }
    </style>
</head>
<body>

<div class="app">
    <h1>🔥 7DS: Origin - Estimador de CP</h1>
    
    <label>Poder de Equipo Actual (CP de Pantalla)</label>
    <input type="number" id="cpActual" value="138503">

    <div class="grid-2">
        <div>
            <div class="section-title">Stats Actuales</div>
            <label>Prob. Crítica %</label>
            <input type="number" id="probAct" value="7.79" step="0.01">
            <label>Ataque Fuego %</label>
            <input type="number" id="atqFuegoAct" value="33.76" step="0.01">
            <label>Daño Crítico %</label>
            <input type="number" id="danoCritAct" value="15.79" step="0.01">
            <label>Daño Hab. Normales %</label>
            <input type="number" id="habAct" value="16.73" step="0.01">
        </div>

        <div>
            <div class="section-title">Stats Nuevas</div>
            <label>Prob. Crítica %</label>
            <input type="number" id="probNue" value="0" step="0.01">
            <label>Ataque Fuego %</label>
            <input type="number" id="atqFuegoNue" value="47.29" step="0.01">
            <label>Daño Crítico %</label>
            <input type="number" id="danoCritNue" value="25.82" step="0.01">
            <label>Daño Hab. Especiales %</label>
            <input type="number" id="habNue" value="23.34" step="0.01">
        </div>
    </div>

    <button onclick="evaluar()">CALCULAR NUEVO PODER</button>

    <div id="veredicto"></div>

    <div class="footer">
        Hecho por <span>Crisvieri</span>
    </div>
</div>

<script>
function evaluar() {
    const cpBase = parseFloat(document.getElementById('cpActual').value) || 0;

    // Métricas Actuales
    const pCritA = parseFloat(document.getElementById('probAct').value)||0;
    const atqA = parseFloat(document.getElementById('atqFuegoAct').value)||0;
    const dCritA = parseFloat(document.getElementById('danoCritAct').value)||0;
    const habA = parseFloat(document.getElementById('habAct').value)||0;

    // Métricas Nuevas
    const pCritN = parseFloat(document.getElementById('probNue').value)||0;
    const atqN = parseFloat(document.getElementById('atqFuegoNue').value)||0;
    const dCritN = parseFloat(document.getElementById('danoCritNue').value)||0;
    const habN = parseFloat(document.getElementById('habNue').value)||0;

    // Ponderación de CP usada por el juego
    const factorCP_A = 1 + (pCritA * 0.012) + (atqA * 0.008) + (dCritA * 0.004) + (habA * 0.002);
    const factorCP_N = 1 + (pCritN * 0.012) + (atqN * 0.008) + (dCritN * 0.004) + (habN * 0.002);

    const cpEstimado = Math.round((cpBase / factorCP_A) * factorCP_N);
    const diferencia = cpEstimado - cpBase;

    const box = document.getElementById('veredicto');
    box.style.display = 'block';

    if (diferencia >= 0) {
        box.className = 'status-ok';
        box.innerHTML = `✔ ¡TIRADA POSITIVA!<span class="cp-val">Nuevo CP Estimado: ${cpEstimado.toLocaleString()} (+${diferencia.toLocaleString()})</span>`;
    } else {
        box.className = 'status-bad';
        box.innerHTML = `✖ ¡PERDERÁS PODER DE EQUIPO!<span class="cp-val">Nuevo CP Estimado: ${cpEstimado.toLocaleString()} (${diferencia.toLocaleString()})</span>`;
    }
}
</script>
</body>
</html>
