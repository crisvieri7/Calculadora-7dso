<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7DS: Origin - Estimador de CP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f0f11;
      /* Ajusta 'ban.png' si tu archivo de imagen tiene otro nombre o formato */
      background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                        url('ban.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: rgba(26, 26, 30, 0.92);
      border: 1px solid #2d2d35;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
    }

    .title {
      font-size: 1.3rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: #a0a0ab;
      margin-bottom: 4px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 10px;
      background-color: #0d0d0f;
      border: 1px solid #33333d;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus {
      border-color: #ff7b3d;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .section-title {
      color: #ff7b3d;
      font-size: 0.82rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      border-bottom: 1px solid #33333d;
      padding-bottom: 4px;
    }

    .btn-calc {
      width: 100%;
      background-color: #e65100;
      color: white;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 18px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background-color 0.2s;
    }

    .btn-calc:hover {
      background-color: #f57c00;
    }

    .result-box {
      margin-top: 18px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }

    .result-title {
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    .result-value {
      font-size: 1.25rem;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      font-size: 0.8rem;
      color: #70707a;
      margin-top: 20px;
    }

    .footer span {
      color: #ff7b3d;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="title">🔥 7DS: Origin - Estimador de CP</div>

  <!-- Poder de Equipo Actual (CP de Pantalla) -->
  <div class="input-group">
    <label for="cpActual">Poder de Equipo Actual (CP de Pantalla)</label>
    <input type="number" id="cpActual" value="138503">
  </div>

  <!-- Columnas de Stats -->
  <div class="stats-grid">
    <!-- Stats Actuales -->
    <div>
      <div class="section-title">STATS ACTUALES</div>
      <div class="input-group">
        <label>Prob. Crítica %</label>
        <input type="number" step="0.01" id="probCritAct" value="7.79">
      </div>
      <div class="input-group">
        <label>Ataque Fuego %</label>
        <input type="number" step="0.01" id="atkFuegoAct" value="33.76">
      </div>
      <div class="input-group">
        <label>Daño Crítico %</label>
        <input type="number" step="0.01" id="dmgCritAct" value="15.79">
      </div>
      <div class="input-group">
        <label>Daño Hab. Normales %</label>
        <input type="number" step="0.01" id="dmgNormAct" value="16.73">
      </div>
    </div>

    <!-- Stats Nuevas -->
    <div>
      <div class="section-title">STATS NUEVAS</div>
      <div class="input-group">
        <label>Prob. Crítica %</label>
        <input type="number" step="0.01" id="probCritNue" value="0">
      </div>
      <div class="input-group">
        <label>Ataque Fuego %</label>
        <input type="number" step="0.01" id="atkFuegoNue" value="47.29">
      </div>
      <div class="input-group">
        <label>Daño Crítico %</label>
        <input type="number" step="0.01" id="dmgCritNue" value="25.82">
      </div>
      <div class="input-group">
        <label>Daño Hab. Especiales %</label>
        <input type="number" step="0.01" id="dmgEspNue" value="23.34">
      </div>
    </div>
  </div>

  <button class="btn-calc" onclick="calcularCP()">CALCULAR NUEVO PODER</button>

  <div id="resultado" class="result-box">
    <div id="tituloResultado" class="result-title"></div>
    <div id="textoResultado" class="result-value"></div>
  </div>

  <div class="footer">Hecho por <span>Crisvieri</span></div>
</div>

<script>
  function calcularCP() {
    const cpActual = parseFloat(document.getElementById('cpActual').value) || 0;

    const diffProb = (parseFloat(document.getElementById('probCritNue').value) || 0) - (parseFloat(document.getElementById('probCritAct').value) || 0);
    const diffAtk = (parseFloat(document.getElementById('atkFuegoNue').value) || 0) - (parseFloat(document.getElementById('atkFuegoAct').value) || 0);
    const diffDmg = (parseFloat(document.getElementById('dmgCritNue').value) || 0) - (parseFloat(document.getElementById('dmgCritAct').value) || 0);
    const diffHab = (parseFloat(document.getElementById('dmgEspNue').value) || 0) - (parseFloat(document.getElementById('dmgNormAct').value) || 0);

    const cambioPorcentual = (diffAtk * 0.0035) + (diffDmg * 0.0025) + (diffProb * 0.0020) + (diffHab * 0.0020);
    
    const incremento = Math.round(cpActual * cambioPorcentual);
    const nuevoCP = cpActual + incremento;

    const resBox = document.getElementById('resultado');
    const resTitle = document.getElementById('tituloResultado');
    const resText = document.getElementById('textoResultado');
    
    resBox.style.display = 'block';
    
    if (incremento >= 0) {
      resBox.style.backgroundColor = '#1b3823';
      resBox.style.border = '1px solid #2e6d3e';
      resTitle.style.color = '#4caf50';
      resTitle.innerText = '✓ ¡TIRADA POSITIVA!';
      resText.style.color = '#81c784';
      resText.innerHTML = `Nuevo CP Estimado: ${nuevoCP.toLocaleString()}<br>(+${incremento.toLocaleString()})`;
    } else {
      resBox.style.backgroundColor = '#381b1b';
      resBox.style.border = '1px solid #6d2e2e';
      resTitle.style.color = '#e57373';
      resTitle.innerText = '✕ ¡TIRADA NEGATIVA!';
      resText.style.color = '#ef9a9a';
      resText.innerHTML = `Nuevo CP Estimado: ${nuevoCP.toLocaleString()}<br>(${incremento.toLocaleString()})`;
    }
  }

  // Escucha la tecla ENTER en toda la página para ejecutar la función
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      calcularCP();
    }
  });
</script>

</body>
</html>
