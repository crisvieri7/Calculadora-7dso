<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escanor - Calculadora & Evaluación de Encantamientos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #08090d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      position: relative;
      background: radial-gradient(circle at top, #2b1206 0%, #08090d 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* PANTALLA DE BIENVENIDA */
    #splashScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 20px;
      overflow: hidden;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .splash-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.7) contrast(1.15) saturate(1.2);
    }

    .splash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(8,9,13,0.6) 0%, rgba(8,9,13,0.2) 40%, rgba(8,9,13,0.92) 85%);
      z-index: 2;
    }

    .splash-content-top, .splash-content-bottom {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    .splash-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: #ff9800;
      text-shadow: 0 0 15px rgba(255, 152, 0, 0.6), 0 2px 8px rgba(0,0,0,0.9);
      letter-spacing: 1px;
    }

    .splash-subtitle {
      font-size: 0.75rem;
      color: #ffcc80;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      margin-top: 4px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);

      letter-spacing: 1.5px;

      width: 100%;
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.6s ease forwards;
      z-index: 5;

      border-radius: 16px;
      padding: 16px;

    .hero-header {

<script>
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // SONIDO ÉPICO 1: "CRUEL SUN" / EXPLOSIÓN SOLAR (Sub-bass potente + Arpegio rápido de energía)
  function reproducirCruelSunEpico() {
    initAudio();
    if (!audioCtx) return;
    
    let now = audioCtx.currentTime;

    // 1. Golpe de impacto grave (Sub-bass boom) tipo videojuego de acción
    let subOsc = audioCtx.createOscillator();
    let subGain = audioCtx.createGain();
    subOsc.type = 'triangle';
    subOsc.frequency.setValueAtTime(150, now);
    subOsc.frequency.exponentialRampToValueAtTime(30, now + 0.4);

    subGain.gain.setValueAtTime(0.4, now);
    subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

    subOsc.connect(subGain);
    subGain.connect(audioCtx.destination);
    subOsc.start(now);
    subOsc.stop(now + 0.45);

    // 2. Ráfaga de energía en aumento (Arpegio rápido estilo láser / plasma mágico)
    const notas = [220, 277.18, 329.63, 440, 554.37, 659.25, 880];
    notas.forEach((freq, index) => {
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      
      let startTime = now + (index * 0.05);
      osc.frequency.setValueAtTime(freq, startTime);
      
      gain.gain.setValueAtTime(0.12, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.15);

      // Filtro para dar brillo metálico/mágico
      let filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(2500, startTime);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start(startTime);
      osc.stop(startTime + 0.15);
    });
  }

  // SONIDO SECUNDARIO: Clic de interfaz ágil
  function reproducirClick() {
    initAudio();
    if (!audioCtx) return;
    
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
    
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  }

  // SONIDO ÉPICO 2: Fanfarria de Éxito / Victoria Triunfal
  function reproducirExitoEpico() {
    initAudio();
    if (!audioCtx) return;
    
    // Acordes de victoria enérgicos (Escala mayor heroica)
    const acordes = [
      { time: 0.0, freqs: [261.63, 329.63, 392.00] }, // C major
      { time: 0.12, freqs: [329.63, 392.00, 523.25] }, // E major / C high
      { time: 0.24, freqs: [392.00, 523.25, 659.25, 783.99] } // G major climax
    ];

    acordes.forEach(block => {
      block.freqs.forEach(freq => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'square';
        
        let startTime = audioCtx.currentTime + block.time;
        osc.frequency.setValueAtTime(freq, startTime);
        
        gain.gain.setValueAtTime(0.08, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.35);
      });
    });
  }

  function entrarApp() {
    reproducirCruelSunEpico();
    const splash = document.getElementById('splashScreen');
    const mainApp = document.getElementById('mainApp');
    
    splash.style.opacity = '0';
    splash.style.transform = 'scale(1.05)';
    
    setTimeout(() => {
      splash.style.display = 'none';
      mainApp.style.display = 'flex';
      actualizarPorcentajes();
    }, 600);
  }

  const pesosStats = {
    dmgFuego: 1.10,
    probCrit: 1.05,
    dmgCrit: 0.90,
    atkFuego: 0.80,
    dmgEspecial: 0.85,
    dmgDef: 0.75,
    cargaMagica: 0.20,
    defensa: 0.60,
    ps: 0.60,
    dmgNormal: 0.80,
    dmgHabNormal: 0.75,
    dmgRelevo: 0.85,
    dmgDefinitiva: 0.90,
    cdr: 0.70,
    resCrit: 0.65,
    defCrit: 0.65,
    rafagaFuego: 1.00
  };

  const rangosStats = {
    defensa: { min: 3.40, max: 5.71 },
    ps: { min: 2.49, max: 4.17 },
    dmgNormal: { min: 18.56, max: 30.95 },
    dmgEspecial: { min: 16.90, max: 28.17 },
    dmgHabNormal: { min: 13.01, max: 21.69 },
    dmgRelevo: { min: 22.86, max: 38.12 },
    dmgDefinitiva: { min: 10.19, max: 16.98 },
    cdr: { min: 6.71, max: 11.19 },
    cargaMagica: { min: 8.95, max: 14.97 },
    probCrit: { min: 6.05, max: 10.11 },
    resCrit: { min: 6.05, max: 10.11 },
    dmgCrit: { min: 10.69, max: 17.83 },
    defCrit: { min: 10.69, max: 17.83 },
    atkFuego: { min: 26.26, max: 43.76 },
    dmgFuego: { min: 11.35, max: 18.98 },
    rafagaFuego: { min: 11.19, max: 18.68 }
  };

  const opciones = [
    { value: 'dmgFuego', text: 'Aumento del daño de tipo Fuego (+11.35% ~ 18.98%)' },
    { value: 'atkFuego', text: 'Aumento del ataque de tipo Fuego (+26.26% ~ 43.76%)' },
    { value: 'rafagaFuego', text: 'Eficacia de las Ráfagas de fuego (+11.19% ~ 18.68%)' },
    { value: 'probCrit', text: 'Probabilidad de crítico (+6.05% ~ 10.11%)' },
    { value: 'dmgCrit', text: 'Daño crítico (+10.69% ~ 17.83%)' },
    { value: 'dmgEspecial', text: 'Aumento del daño de ataques especiales (+16.90% ~ 28.17%)' },
    { value: 'dmgDefinitiva', text: 'Aumento del daño de movimientos definitivos (+10.19% ~ 16.98%)' },
    { value: 'dmgRelevo', text: 'Aumento del daño de habilidades de relevo (+22.86% ~ 38.12%)' },
    { value: 'cargaMagica', text: 'Eficacia de la carga mágica (+8.95% ~ 14.97%)' },
    { value: 'dmgNormal', text: 'Aumento del daño de ataques normales (+18.56% ~ 30.95%)' },
    { value: 'dmgHabNormal', text: 'Aumento del daño de habilidades normales (+13.01% ~ 21.69%)' },
    { value: 'cdr', text: 'Reducción del tiempo de recuperación (+6.71% ~ 11.19%)' },
    { value: 'defensa', text: 'Aumento de la defensa (+3.40% ~ 5.71%)' },
    { value: 'ps', text: 'Aumento de los PS (+2.49% ~ 4.17%)' },
    { value: 'resCrit', text: 'Resistencia crítica (+6.05% ~ 10.11%)' },
    { value: 'defCrit', text: 'Defensa crítica (+10.69% ~ 17.83%)' }
  ];

  function init() {
    const selects = document.querySelectorAll('select');
    selects.forEach(s => {
      s.innerHTML = '';
      opciones.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.value;
        opt.textContent = o.text;
        s.appendChild(opt);
      });
    });

    document.getElementById('s1_act').value = 'dmgFuego';
    document.getElementById('s2_act').value = 'atkFuego';
    document.getElementById('s3_act').value = 'cargaMagica';
    document.getElementById('s4_act').value = 'dmgEspecial';

    document.getElementById('s1_nue').value = 'dmgFuego';
    document.getElementById('s2_nue').value = 'atkFuego';
    document.getElementById('s3_nue').value = 'probCrit';
    document.getElementById('s4_nue').value = 'dmgEspecial';
  }

  function calcularPorcentajeStat(tipo, valor) {
    const rango = rangosStats[tipo];
    if (!rango) return 0;
    let pct = ((valor - rango.min) / (rango.max - rango.min)) * 100;
    if (pct < 0) pct = 0;
    if (pct > 100) pct = 100;
    return pct.toFixed(0);
  }

  function actualizarPorcentajes() {
    ['act', 'nue'].forEach(tipoPanel => {
      for (let i = 1; i <= 4; i++) {
        const statTipo = document.getElementById(`s${i}_${tipoPanel}`).value;
        const statVal = parseFloat(document.getElementById(`${tipoPanel}${i}`).value) || 0;
        const pct = calcularPorcentajeStat(statTipo, statVal);
        
        const etiqueta = document.getElementById(`q_${tipoPanel}${i}`);
        etiqueta.innerText = `Calidad: ${pct}%`;

        if (pct >= 85) {
          etiqueta.style.color = '#4caf50'; 
        } else if (pct >= 50) {
          etiqueta.style.color = '#ffb74d'; 
        } else {
          etiqueta.style.color = '#e57373'; 
        }
      }
    });
  }

  function copiarActualParaNuevo() {
    for (let i = 1; i <= 4; i++) {
      document.getElementById(`s${i}_nue`).value = document.getElementById(`s${i}_act`).value;
      document.getElementById(`nue${i}`).value = document.getElementById(`act${i}`).value;
    }
    actualizarPorcentajes();
  }

  function mantenerYCambiar() {
    for (let i = 1; i <= 4; i++) {
      document.getElementById(`s${i}_act`).value = document.getElementById(`s${i}_nue`).value;
      document.getElementById(`act${i}`).value = document.getElementById(`nue${i}`).value;
    }

    let cpEst = document.getElementById('btnAplicar').getAttribute('data-cp');
    let atqEst = document.getElementById('btnAplicar').getAttribute('data-atq');
    
    if(cpEst) document.getElementById('baseCP').value = cpEst;
    if(atqEst) document.getElementById('baseAtqFuego').value = atqEst;

    actualizarPorcentajes();

    document.getElementById('btnAplicar').style.display = 'none';
    const resBox = document.getElementById('resultado');
    const resTitle = document.getElementById('tituloResultado');
    const resText = document.getElementById('textoResultado');
    const resNota = document.getElementById('notaEscanor');

    resBox.style.backgroundColor = '#112919';
    resBox.style.border = '1px solid #2e6d3e';
    resTitle.style.color = '#4caf50';
    resTitle.innerText = '¡ESTADÍSTICAS ACTUALIZADAS!';
    resText.style.color = '#81c784';
    resText.innerText = 'El nuevo roll ahora es tu base actual.';
    resNota.innerHTML = 'Tus atributos principales se han incrementado automáticamente.';
  }

  function calcular() {
    let cpBase = parseFloat(document.getElementById('baseCP').value) || 0;
    let atqBase = parseFloat(document.getElementById('baseAtqFuego').value) || 0;

    let pAct = 0, pNue = 0;

    for (let i = 1; i <= 4; i++) {
      const tA = document.getElementById(`s${i}_act`).value;
      const vA = parseFloat(document.getElementById(`act${i}`).value) || 0;
      pAct += vA * (pesosStats[tA] || 0);

      const tN = document.getElementById(`s${i}_nue`).value;
      const vN = parseFloat(document.getElementById(`nue${i}`).value) || 0;
      pNue += vN * (pesosStats[tN] || 0);
    }

    const difPuntaje = pNue - pAct;
    const porcentajeCambio = ((difPuntaje / (pAct || 1)) * 100).toFixed(1);

    let nuevoCPestimado = Math.round(cpBase + (difPuntaje * 12));
    let nuevoAtqEstimado = (atqBase + (difPuntaje * 0.4)).toFixed(2);

    const resBox = document.getElementById('resultado');
    const resTitle = document.getElementById('tituloResultado');
    const resText = document.getElementById('textoResultado');
    const resNota = document.getElementById('notaEscanor');
    const btnAplicar = document.getElementById('btnAplicar');

    resBox.style.display = 'block';

    if (difPuntaje > 0) {
      resBox.style.backgroundColor = '#112919';
      resBox.style.border = '1px solid #2e6d3e';
      resTitle.style.color = '#4caf50';
      resTitle.innerText = '✓ ¡EL SOL BRILLA A TU FAVOR!';
      resText.style.color = '#81c784';
      resText.innerText = `Rendimiento de Orbe: +${porcentajeCambio}%`;
      resNota.style.color = '#a5d6a7';
      resNota.innerHTML = `Al cambiarla, tu equipo mejorará:<br><b>• CP Estimado:</b> ${cpBase} ➔ <b>${nuevoCPestimado}</b><br><b>• Atq. Fuego:</b> ${atqBase}% ➔ <b>${nuevoAtqEstimado}%</b><br>¡Haz clic en "Mantener" para guardar los cambios!`;

      btnAplicar.setAttribute('data-cp', nuevoCPestimado);
      btnAplicar.setAttribute('data-atq', nuevoAtqEstimado);
      btnAplicar.style.display = 'block';

    } else {
      btnAplicar.style.display = 'none';
      if (difPuntaje === 0) {
        resBox.style.backgroundColor = '#212631';
        resBox.style.border = '1px solid #4f5b75';
        resTitle.style.color = '#90caf9';
        resTitle.innerText = 'ORBE EQUIVALENTE';
        resText.style.color = '#e3f2fd';
        resText.innerText = 'El impacto de combate es idéntico.';
        resNota.innerHTML = 'Tus estadísticas globales no sufrirán cambios significativos.';
      } else {
        resBox.style.backgroundColor = '#2d1414';
        resBox.style.border = '1px solid #6d2e2e';
        resTitle.style.color = '#e57373';
        resTitle.innerText = '✕ DESCARTAR (QUÉ ORGULLO NO BAJAR)';
        resText.style.color = '#ef9a9a';
        resText.innerText = `Pérdida de rendimiento: ${porcentajeCambio}%`;
        resNota.style.color = '#ffab91';
        resNota.innerHTML = `Al cambiarla perderías efectividad:<br><b>• CP Proyectado bajaría a:</b> ~${nuevoCPestimado}<br>Mantén tu orbe actual para estar en la cima.`;
      }
    }
  }

  init();
</script>

</body>
</html>
