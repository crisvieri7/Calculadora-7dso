<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7DS: Origin - Estimador de CP (Ofensivo)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0e12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .game-card {
      background: rgba(18, 20, 28, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px 14px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9);
    }
    .game-title {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 15px;
      color: #f0f0f5;
    }
    .cp-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cp-box label { font-size: 0.8rem; color: #8f93a3; font-weight: 600; }
    .cp-box input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: right;
      width: 120px;
      outline: none;
    }
    .comparison-container {
      display: grid;
      grid-template-columns: 1fr 18px 1fr;
      gap: 8px;
      align-items: center;
    }
    .column-panel {
      background: rgba(10, 12, 18, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .panel-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 2px;
    }
    .panel-title.act { color: #a0a5b8; }
    .panel-title.nue { color: #78a1e8; }
    .center-divider {
      text-align: center;
      color: #5d637a;
      font-size: 1.1rem;
      font-weight: bold;
    }
    .stat-box { display: flex; flex-direction: column; gap: 4px; }
    select {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      color: #e1e4ed;
      font-size: 0.68rem;
      padding: 5px 3px;
      outline: none;
      width: 100%;
      text-overflow: ellipsis;
    }
    input.stat-input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 5px;
      text-align: right;
      outline: none;
      width: 100%;
    }
    input.stat-input.new-value {
      border-color: rgba(120, 161, 232, 0.4);
      background: rgba(120, 161, 232, 0.08);
    }
    .btn-calc {
      width: 100%;
      background: #e65100;
      color: white;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 16px;
      text-transform: uppercase;
    }
    .result-box {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .result-title { font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; }
    .result-value { font-size: 1.15rem; font-weight: bold; }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="game-title">Resultados de encantamiento</div>

    <div class="cp-box">
      <label for="cpActual">CP Actual</label>
      <input type="number" inputmode="decimal" id="cpActual" value="138503">
    </div>

    <div class="comparison-container">
      
      <!-- BONIFICACIÓN ACTUAL -->
      <div class="column-panel">
        <div class="panel-title act">Bonificación actual</div>

        <div class="stat-box">
          <select id="statType1_act" class="stat-select-act-1"></select>
          <input type="number" inputmode="decimal" step="0.01" class="stat-input" id="act1" value="13.53">
        </div>

        <div class="stat-box">
          <select id="statType2_act" class="stat-select-act-2"></select>
          <input type="number" inputmode="decimal" step="0.01" class="stat-input" id="act2" value="33.76">
        </div>

        <div class="stat-box">
          <select id="statType3_act" class="stat-select-act-3"></select>
          <input type="number" inputmode="decimal" step="0.01" class="stat-input" id="act3" value="8.95">
        </div>

        <div class="stat-box">
          <select id="statType4_act" class="stat-select-act-4"></select>
          <input type="number" inputmode="decimal" step="0.01" class="stat-input" id="act4" value="23.34">
        </div>
      </div>

      <div class="center-divider">➾</div>

      <!-- NUEVA BONIFICACIÓN -->
      <div class="column-panel">
        <div class="panel-title nue">Nueva bonificación</div>

        <div class="stat-box">
          <select id="statType1_nue" class="stat-select-nue-1"></select>
          <input type="number" inputmode="decimal" step="0.01" class="stat-input new-value" id="nue1" value="13.25">
        </div>

        <div class="stat-box">
          <select id="statType2_nue" class="stat-select-nue-2"></select>
          <input type="number" inputmode="decimal" step="0.01" class="stat-input new-value" id="nue2" value="14.07">
        </div>

        <div class="stat-box">
          <select id="statType3_nue" class="stat-select-nue-3"></select>
          <input type="number" inputmode="decimal" step="0.01" class="stat-input new-value" id="nue3" value="26.26">
        </div>

        <div class="stat-box">
          <select id="statType4_nue" class="stat-select-nue-4"></select>
          <input type="number" inputmode="decimal" step="0.01" class="stat-input new-value" id="nue4" value="15.79">
        </div>
      </div>

    </div>

    <button type="button" class="btn-calc" onclick="calcularCP()">CALCULAR NUEVO PODER</button>

    <div id="resultado" class="result-box">
      <div id="tituloResultado" class="result-title"></div>
      <div id="textoResultado" class="result-value"></div>
    </div>
  </div>

<script>
  // PONDERACIÓN SOLAMENTE DE STATS CLAVE DE DAÑO / CP
  const pesosStats = {
    atkFuego: 0.0035,        // Ataque de tipo fuego %
    dmgFuego: 0.0032,        // Daño de tipo fuego %
    probCrit: 0.0028,        // Probabilidad de crítico %
    dmgCrit: 0.0025,         // Daño crítico %
    dmgDefinitivos: 0.0024,  // Daño de movimientos definitivos %
    dmgEsp: 0.0022,          // Daño de ataques especiales %
    cargaMagica: 0.0015,     // Eficacia de la carga mágica %
    ninguno: 0
  };

  const opcionesStats = [
    { value: 'atkFuego', text: 'Ataque tipo fuego %' },
    { value: 'dmgFuego', text: 'Daño tipo fuego %' },
    { value: 'probCrit', text: 'Probabilidad de crítico %' },
    { value: 'dmgCrit', text: 'Daño crítico %' },
    { value: 'dmgDefinitivos', text: 'Mov. definitivos %' },
    { value: 'dmgEsp', text: 'Ataques especiales %' },
    { value: 'cargaMagica', text: 'Carga mágica %' },
    { value: 'ninguno', text: '-- Ninguno --' }
  ];

  function poblarSelects() {
    const selects = document.querySelectorAll('select');
    selects.forEach(select => {
      select.innerHTML = '';
      opcionesStats.forEach(opt => {
        const optionEl = document.createElement('option');
        optionEl.value = opt.value;
        optionEl.textContent = opt.text;
        select.appendChild(optionEl);
      });
    });

    // Valores por defecto acordes a tu captura de pantalla
    document.getElementById('statType1_act').value = 'dmgFuego';
    document.getElementById('statType2_act').value = 'atkFuego';
    document.getElementById('statType3_act').value = 'cargaMagica';
    document.getElementById('statType4_act').value = 'dmgEsp';

    document.getElementById('statType1_nue').value = 'cargaMagica';
    document.getElementById('statType2_nue').value = 'dmgDefinitivos';
    document.getElementById('statType3_nue').value = 'atkFuego';
    document.getElementById('statType4_nue').value = 'dmgCrit';
  }

  function calcularCP() {
    const cpActual = parseFloat(document.getElementById('cpActual').value) || 0;
    
    let puntosOrbeAnterior = 0;
    let puntosOrbeNuevo = 0;

    for (let i = 1; i <= 4; i++) {
      const typeAct = document.getElementById(`statType${i}_act`).value;
      const actVal = parseFloat(document.getElementById(`act${i}`).value) || 0;
      puntosOrbeAnterior += (actVal * (pesosStats[typeAct] || 0));

      const typeNue = document.getElementById(`statType${i}_nue`).value;
      const nueVal = parseFloat(document.getElementById(`nue${i}`).value) || 0;
      puntosOrbeNuevo += (nueVal * (pesosStats[typeNue] || 0));
    }

    const cambioTotalPorcentual = puntosOrbeNuevo - puntosOrbeAnterior;
    const incremento = Math.round(cpActual * (cambioTotalPorcentual / 100));
    const nuevoCP = cpActual + incremento;

    const resBox = document.getElementById('resultado');
    const resTitle = document.getElementById('tituloResultado');
    const resText = document.getElementById('textoResultado');
    
    resBox.style.display = 'block';
    
    if (incremento >= 0) {
      resBox.style.backgroundColor = '#112919';
      resBox.style.border = '1px solid #2e6d3e';
      resTitle.style.color = '#4caf50';
      resTitle.innerText = '✓ ¡APLICAR (TIRADA POSITIVA)!';
      resText.style.color = '#81c784';
      resText.innerHTML = `Nuevo CP Estimado: ${nuevoCP.toLocaleString()}<br>(+${incremento.toLocaleString()})`;
    } else {
      resBox.style.backgroundColor = '#2d1414';
      resBox.style.border = '1px solid #6d2e2e';
      resTitle.style.color = '#e57373';
      resTitle.innerText = '✕ ¡MANTENER (TIRADA NEGATIVA)!';
      resText.style.color = '#ef9a9a';
      resText.innerHTML = `Nuevo CP Estimado: ${nuevoCP.toLocaleString()}<br>(${incremento.toLocaleString()})`;
    }
  }

  // Cargar lista filtrada al iniciar
  poblarSelects();
</script>

</body>
</html>
