<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escanor - Calculadora & Evaluación de Encantamientos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #1a0f2e 0%, #08090d 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* CONTENEDOR GENERAL */
    .app-container {
      width: 100%;
      max-width: 480px;
      position: relative;
    }

    /* PANTALLA 1: BIENVENIDA / SPLASH (IMAGEN CENTRADA + BOTÓN ENTER) */
    #splashScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      padding: 20px;
      background: rgba(16, 18, 26, 0.95);
      border: 1px solid rgba(255, 152, 0, 0.3);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .splash-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffb74d;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .splash-image-container {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 3px solid #ff9800;
      box-shadow: 0 0 20px rgba(255, 152, 0, 0.5);
      overflow: hidden;
      background: #281a08;
    }

    .splash-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-enter {
      background: linear-gradient(135deg, #ff9800 0%, #e65100 100%);
      color: white;
      border: none;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(230, 81, 0, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-enter:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(230, 81, 0, 0.6);
    }

    /* PANTALLA 2: LA APLICACIÓN PRINCIPAL (OCULTA AL INICIO) */
    #mainApp {
      display: none;
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* TARJETA DE PERFIL DE HÉROE */
    .hero-card {
      background: rgba(16, 18, 26, 0.95);
      border: 1px solid rgba(255, 152, 0, 0.3);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }
    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .hero-title { font-size: 1.1rem; font-weight: 800; color: #ffb74d; }
    .hero-cp { font-size: 0.85rem; color: #8c93a8; font-weight: bold; }
    .hero-cp span { color: #fff; font-size: 1.05rem; }

    .hero-profile {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .hero-avatar {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: 2px solid #ff9800;
      background: #281a08 url('IMG_2253.jpeg') center/cover no-repeat;
      box-shadow: 0 0 10px rgba(255, 152, 0, 0.4);
      flex-shrink: 0;
    }
    .hero-base-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 100%;
      font-size: 0.72rem;
    }
    .stat-pill {
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .stat-pill label { display: block; color: #8c93a8; font-size: 0.65rem; }
    .stat-pill val { font-weight: bold; color: #ffcc80; }

    /* TARJETA DE EVALUACIÓN DE ENCANTAMIENTO */
    .calc-card {
      background: rgba(16, 18, 26, 0.95);
      border: 1px solid rgba(230, 81, 0, 0.3);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
    }
    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #ff9800;
      text-align: center;
      margin-bottom: 12px;
    }
    .comparison-container {
      display: grid;
      grid-template-columns: 1fr 16px 1fr;
      gap: 6px;
      align-items: center;
    }
    .column-panel {
      background: rgba(8, 10, 15, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .panel-title { font-size: 0.72rem; font-weight: 700; text-align: center; }
    .panel-title.act { color: #8c93a8; }
    .panel-title.nue { color: #ffb74d; }
    .center-divider { text-align: center; color: #4a5064; font-size: 1rem; }
    .stat-box { display: flex; flex-direction: column; gap: 3px; }
    select {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      color: #d1d5e0;
      font-size: 0.65rem;
      padding: 4px 2px;
      outline: none;
      width: 100%;
    }
    input.stat-input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 4px;
      text-align: right;
      outline: none;
      width: 100%;
    }
    input.stat-input.new-value {
      border-color: rgba(255, 152, 0, 0.4);
      background: rgba(255, 152, 0, 0.08);
    }
    .action-buttons { display: flex; gap: 8px; margin-top: 14px; }
    .btn-calc {
      flex: 2;
      background: #e65100;
      color: white;
      border: none;
      padding: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-reset {
      flex: 1;
      background: #232733;
      color: #8c93a8;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .result-box {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      display: none;
    }
    .result-title { font-weight: bold; font-size: 0.85rem; margin-bottom: 2px; }
    .result-value { font-size: 0.95rem; font-weight: bold; }
    .escanor-note { font-size: 0.72rem; margin-top: 5px; opacity: 0.9; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- ================= PANTALLA 1: BIENVENIDA / ENTER ================= -->
    <div id="splashScreen">
      <div class="splash-title">🔥 Calculadora Escanor 7DS</div>
      <div class="splash-image-container">
        <img src="IMG_2253.jpeg" alt="Escanor Preview">
      </div>
      <button type="button" class="btn-enter" onclick="entrarApp()">ENTER</button>
    </div>

    <!-- ================= PANTALLA 2: APLICACIÓN PRINCIPAL ================= -->
    <div id="mainApp">
      
      <!-- Tarjeta de Perfil de Héroe -->
      <div class="hero-card">
        <div class="hero-header">
          <div class="hero-title">Escanor (Rango IV)</div>
          <div class="hero-cp">Poder: <span>37,188</span></div>
        </div>
        <div class="hero-profile">
          <div class="hero-avatar"></div>
          <div class="hero-base-stats">
            <div class="stat-pill"><label>Atq Fuego %</label><val>99.08%</val></div>
            <div class="stat-pill"><label>Daño Fuego %</label><val>13.53%</val></div>
            <div class="stat-pill"><label>Prob. Crítica</label><val>33.76%</val></div>
            <div class="stat-pill"><label>Daño Crítico</label><val>113.51%</val></div>
          </div>
        </div>
      </div>

      <!-- Tarjeta Evaluador de Encantamientos -->
      <div class="calc-card">
        <div class="section-title">Evaluador de Encantamiento (Hacha)</div>

        <div class="comparison-container">
          <!-- ACTUAL -->
          <div class="column-panel">
            <div class="panel-title act">Hacha Actual</div>
            <div class="stat-box"><select id="s1_act"></select><input type="number" step="0.01" class="stat-input" id="act1" value="13.53"></div>
            <div class="stat-box"><select id="s2_act"></select><input type="number" step="0.01" class="stat-input" id="act2" value="33.76"></div>
            <div class="stat-box"><select id="s3_act"></select><input type="number" step="0.01" class="stat-input" id="act3" value="8.95"></div>
            <div class="stat-box"><select id="s4_act"></select><input type="number" step="0.01" class="stat-input" id="act4" value="23.34"></div>
          </div>

          <div class="center-divider">➔</div>

          <!-- NUEVO -->
          <div class="column-panel">
            <div class="panel-title nue">Nuevo Intento</div>
            <div class="stat-box"><select id="s1_nue"></select><input type="number" step="0.01" class="stat-input new-value" id="nue1" value="13.53"></div>
            <div class="stat-box"><select id="s2_nue"></select><input type="number" step="0.01" class="stat-input new-value" id="nue2" value="33.76"></div>
            <div class="stat-box"><select id="s3_nue"></select><input type="number" step="0.01" class="stat-input new-value" id="nue3" value="12.00"></div>
            <div class="stat-box"><select id="s4_nue"></select><input type="number" step="0.01" class="stat-input new-value" id="nue4" value="23.34"></div>
          </div>
        </div>

        <div class="action-buttons">
          <button type="button" class="btn-reset" onclick="copiarActual()">Copiar Actual</button>
          <button type="button" class="btn-calc" onclick="calcular()">Evaluar Tirada</button>
        </div>

        <div id="resultado" class="result-box">
          <div id="tituloResultado" class="result-title"></div>
          <div id="textoResultado" class="result-value"></div>
          <div id="notaEscanor" class="escanor-note"></div>
        </div>
      </div>

    </div>

  </div>

<script>
  function entrarApp() {
    const splash = document.getElementById('splashScreen');
    const mainApp = document.getElementById('mainApp');
    
    splash.style.opacity = '0';
    setTimeout(() => {
      splash.style.display = 'none';
      mainApp.style.display = 'flex';
    }, 400);
  }

  const pesosStats = {
    dmgFuego: 1.10,
    probCrit: 1.05,
    dmgCrit: 0.90,
    atkFuego: 0.80,
    dmgEspecial: 0.85,
    dmgDef: 0.75,
    cargaMagica: 0.20
  };

  const opciones = [
    { value: 'dmgFuego', text: 'Aumento del daño de tipo fuego' },
    { value: 'atkFuego', text: 'Aumento del ataque de tipo fuego' },
    { value: 'probCrit', text: 'Probabilidad de crítico %' },
    { value: 'dmgCrit', text: 'Daño crítico %' },
    { value: 'dmgEspecial', text: 'Aumento daño ataques especiales' },
    { value: 'dmgDef', text: 'Aumento daño mov. definitivos' },
    { value: 'cargaMagica', text: 'Eficacia de la carga mágica' }
  ];

  function init() {
    const selects = document.querySelectorAll('select');
    selects.forEach(s => {
      s.innerHTML = '';
      opciones.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.value;
        opt.textContent = o.text;
        s.appendChild(opt);
      });
    });

    document.getElementById('s1_act').value = 'dmgFuego';
    document.getElementById('s2_act').value = 'atkFuego';
    document.getElementById('s3_act').value = 'cargaMagica';
    document.getElementById('s4_act').value = 'dmgEspecial';

    document.getElementById('s1_nue').value = 'dmgFuego';
    document.getElementById('s2_nue').value = 'atkFuego';
    document.getElementById('s3_nue').value = 'probCrit';
    document.getElementById('s4_nue').value = 'dmgEspecial';
  }

  function copiarActual() {
    for (let i = 1; i <= 4; i++) {
      document.getElementById(`s${i}_nue`).value = document.getElementById(`s${i}_act`).value;
      document.getElementById(`nue${i}`).value = document.getElementById(`act${i}`).value;
    }
  }

  function calcular() {
    let pAct = 0, pNue = 0;

    for (let i = 1; i <= 4; i++) {
      const tA = document.getElementById(`s${i}_act`).value;
      const vA = parseFloat(document.getElementById(`act${i}`).value) || 0;
      pAct += vA * (pesosStats[tA] || 0);

      const tN = document.getElementById(`s${i}_nue`).value;
      const vN = parseFloat(document.getElementById(`nue${i}`).value) || 0;
      pNue += vN * (pesosStats[tN] || 0);
    }

    const dif = pNue - pAct;
    const porcentajeCambio = ((dif / pAct) * 100).toFixed(1);

    const resBox = document.getElementById('resultado');
    const resTitle = document.getElementById('tituloResultado');
    const resText = document.getElementById('textoResultado');
    const resNota = document.getElementById('notaEscanor');

    resBox.style.display = 'block';

    if (dif > 0) {
      resBox.style.backgroundColor = '#112919';
      resBox.style.border = '1px solid #2e6d3e';
      resTitle.style.color = '#4caf50';
      resTitle.innerText = '✓ ¡ACEPTAR NUEVO ENCANTAMIENTO!';
      resText.style.color = '#81c784';
      resText.innerText = `Rendimiento de DPS Estimado: +${porcentajeCambio}%`;
      resNota.style.color = '#a5d6a7';
      resNota.innerText = 'Esta tirada aprovecha mejor tus multiplicadores críticos y de fuego.';
    } else if (dif === 0) {
      resBox.style.backgroundColor = '#212631';
      resBox.style.border = '1px solid #4f5b75';
      resTitle.style.color = '#90caf9';
      resTitle.innerText = 'EQUIVALENTE';
      resText.style.color = '#e3f2fd';
      resText.innerText = 'El impacto en combate es prácticamente idéntico.';
      resNota.innerText = '';
    } else {
      resBox.style.backgroundColor = '#2d1414';
      resBox.style.border = '1px solid #6d2e2e';
      resTitle.style.color = '#e57373';
      resTitle.innerText = '✕ DESCARTAR (MANTENER ACTUAL)';
      resText.style.color = '#ef9a9a';
      resText.innerText = `Pérdida de Rendimiento: ${porcentajeCambio}%`;
      resNota.style.color = '#ffab91';
      resNota.innerText = 'No compenses perder Atq. Fuego o Daño Fuego a menos que sea por mucha Prob. Crítica.';
    }
  }

  init();
</script>

</body>
</html>
